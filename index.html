<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loto Layer - 宝くじ予測</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0057a8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  :root {
    --bg: #f0f4fa;
    --panel: #ffffff;
    --border: #dde4f0;
    --blue: #0057a8;
    --blue2: #0073d1;
    --blue-light: #e8f0fb;
    --green: #00963c;
    --green-light: #e6f5ec;
    --purple: #6b3fa0;
    --purple-light: #f0eaf8;
    --gold: #c8960a;
    --gold2: #e6aa00;
    --red: #d42020;
    --text: #1a1a2e;
    --muted: #6b7a99;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #eef2f9;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Canvas background for flying balls */
  #bgCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.18;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 100% 40% at 50% 0%, rgba(0,87,168,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 30px 0 24px;
  }

  .header-ball {
    width: 90px;
    height: 90px;
    margin: 0 auto 16px;
  }

  .header-ball svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 16px rgba(0,87,168,0.35)) drop-shadow(0 2px 6px rgba(0,0,0,0.15));
    animation: ballBounce 2.4s ease-in-out infinite;
  }

  @keyframes ballBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, #0057a8, #0088ee, #00963c, #6b3fa0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }

  .header p {
    color: #6b7a99;
    font-size: 0.85rem;
    margin-top: 6px;
    letter-spacing: 0.05em;
  }

  /* Section card */
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,87,168,0.07);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }

  .card-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--blue);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: var(--blue);
    border-radius: 2px;
    display: inline-block;
  }

  /* Mode selector */
  .mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .mode-tab {
    background: #f5f7fc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
  }

  .mode-tab .tab-name {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }

  .mode-tab .tab-desc {
    font-size: 0.7rem;
    display: block;
  }

  .mode-tab.active {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue);
    box-shadow: 0 2px 8px rgba(0,87,168,0.15);
  }

  /* Model selector */
  .model-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .model-btn {
    background: #f5f7fc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.8rem;
    text-align: left;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .model-btn .model-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  .model-btn.active {
    border-color: var(--blue2);
    background: var(--blue-light);
    color: var(--blue);
  }

  .model-btn.active .model-dot {
    background: var(--blue2);
    box-shadow: 0 0 6px rgba(0,115,209,0.5);
  }

  /* Count selector */
  .count-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .count-label {
    color: #6b7a99;
    font-size: 0.85rem;
    flex: 1;
  }

  .count-btns {
    display: flex;
    gap: 6px;
  }

  .count-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #f5f7fc;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    transition: all 0.2s;
  }

  .count-btn.active {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue);
  }

  /* API Key */
  .api-input {
    width: 100%;
    background: #f5f7fc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .api-input:focus { border-color: var(--blue2); }
  .api-input::placeholder { color: var(--muted); }

  /* Generate button */
  .gen-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #004a99, #0067cc, #0088ee, #0067cc, #004a99);
    background-size: 200% 200%;
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,40,0.3);
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    animation: shimmerBg 3s ease infinite;
  }

  @keyframes shimmerBg {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .gen-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,87,168,0.4); }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Results */
  .results-area { margin-top: 0; }

  .result-set {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(0,87,168,0.07);
    animation: fadeInUp 0.4s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-set-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .set-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .set-type-badge {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 20px;
    font-family: 'Orbitron', monospace;
    letter-spacing: 0.05em;
  }

  .badge-loto6 { background: #e8f0fb; color: #0057a8; border: 1px solid #b8d0f0; }
  .badge-loto7 { background: #f0eaf8; color: #6b3fa0; border: 1px solid #d0b8f0; }
  .badge-mini  { background: #e6f5ec; color: #00963c; border: 1px solid #a8dfc0; }

  /* Lottery balls */
  .balls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    justify-content: center;
  }

  .ball {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    position: relative;
    animation: ballPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    flex-shrink: 0;
  }

  @keyframes ballPop {
    from { transform: scale(0) rotate(-30deg); opacity: 0; }
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .ball::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 10px;
    width: 14px;
    height: 8px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    transform: rotate(-30deg);
  }

  /* Ball colors by range */
  .ball-white { background: radial-gradient(circle at 35% 35%, #fff, #ccc); color: #333; }
  .ball-yellow { background: radial-gradient(circle at 35% 35%, #ffe066, #cc9900); color: #222; }
  .ball-pink   { background: radial-gradient(circle at 35% 35%, #ff8ec6, #cc3377); color: #fff; }
  .ball-orange { background: radial-gradient(circle at 35% 35%, #ffa040, #cc5500); color: #fff; }
  .ball-teal   { background: radial-gradient(circle at 35% 35%, #40ffe0, #009977); color: #fff; }
  .ball-blue   { background: radial-gradient(circle at 35% 35%, #70aaff, #2244cc); color: #fff; }
  .ball-red    { background: radial-gradient(circle at 35% 35%, #ff6666, #cc0000); color: #fff; }
  .ball-bonus  {
    background: radial-gradient(circle at 35% 35%, #ffd700, #aa6600);
    color: #222;
    box-shadow: 0 0 14px rgba(255,215,0,0.5);
    border: 2px solid var(--gold);
  }

  .bonus-label {
    font-size: 0.6rem;
    color: var(--gold);
    text-align: center;
    margin-top: -6px;
    margin-bottom: 4px;
    font-family: 'Orbitron', monospace;
    letter-spacing: 0.05em;
  }

  .ball-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* AI comment */
  .ai-comment {
    background: #f0f4fa;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.75);
    line-height: 1.6;
  }

  .ai-comment-header {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    color: var(--blue);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ai-comment-header::before {
    content: '✦';
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 4px;
  }

  .stat-cell {
    border-radius: 6px;
    padding: 4px 2px;
    text-align: center;
    cursor: default;
    transition: transform 0.15s;
  }

  .stat-cell:hover { transform: scale(1.1); }

  .stat-num {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    display: block;
  }

  .stat-count {
    font-size: 0.6rem;
    color: var(--muted);
    display: block;
  }

  /* Loading */
  .loading-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 20px;
  }

  .loading-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    animation: dotBounce 1.2s ease infinite;
  }

  .loading-dot:nth-child(2) { animation-delay: 0.2s; background: var(--green); }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; background: var(--purple); }

  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Error */
  .error-msg {
    background: #fff0f0;
    border: 1px solid #ffcccc;
    border-radius: 10px;
    padding: 12px;
    color: var(--red);
    font-size: 0.83rem;
    margin-bottom: 12px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding-top: 20px;
    color: #8899bb;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
  }

  /* Frequency bar */
  .freq-bar {
    height: 3px;
    border-radius: 2px;
    margin-top: 3px;
  }

  select.api-input {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  /* API row */
  .api-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 10px;
  }

  .api-col-label {
    font-size: 0.75rem;
    color: var(--blue);
    margin-bottom: 6px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .api-input-wrap {
    display: flex;
    gap: 4px;
  }

  .api-input-half {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    font-size: 0.8rem;
  }

  .api-show-btn {
    background: #e8edf7;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.72rem;
    padding: 0 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .api-show-btn:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text);
  }

  .api-note {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.5;
  }


</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-ball">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="hbg" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#4da8ff"/>
            <stop offset="100%" stop-color="#0044aa"/>
          </radialGradient>
          <radialGradient id="shine" cx="30%" cy="25%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- Shadow -->
        <ellipse cx="50" cy="93" rx="28" ry="6" fill="rgba(0,0,0,0.12)"/>
        <!-- Main ball -->
        <circle cx="50" cy="48" r="44" fill="url(#hbg)"/>
        <!-- White equator band -->
        <ellipse cx="50" cy="48" rx="44" ry="13" fill="#ffffff" opacity="0.95"/>
        <!-- Shine -->
        <ellipse cx="36" cy="30" rx="15" ry="10" fill="url(#shine)" transform="rotate(-25 36 30)"/>
        <!-- Number on band -->
        <text x="50" y="54" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#0044aa">LOTO</text>
      </svg>
    </div>
    <h1>LOTO LAYER</h1>
    <p>統計 × AI 予測 ｜ ロト6 / ロト7 / ミニロト</p>
  </div>

  <!-- Mode Select -->
  <div class="card">
    <div class="card-title">ロトの種類</div>
    <div class="mode-tabs">
      <button class="mode-tab active" onclick="selectMode('loto6')" id="tab-loto6">
        <span class="tab-name">LOTO 6</span>
        <span class="tab-desc">1〜43 / 6個</span>
      </button>
      <button class="mode-tab" onclick="selectMode('loto7')" id="tab-loto7">
        <span class="tab-name">LOTO 7</span>
        <span class="tab-desc">1〜37 / 7個</span>
      </button>
      <button class="mode-tab" onclick="selectMode('mini')" id="tab-mini">
        <span class="tab-name">MINI</span>
        <span class="tab-desc">1〜31 / 5個</span>
      </button>
    </div>
  </div>

  <!-- Model Select -->
  <div class="card">
    <div class="card-title">AI モデル</div>
    <div class="model-grid">
      <button class="model-btn active" onclick="selectModel('groq')" id="model-groq">
        <span class="model-dot"></span>Groq（llama-3.3-70b）
      </button>
      <button class="model-btn" onclick="selectModel('gemma')" id="model-gemma">
        <span class="model-dot"></span>Gemma（gemma2-9b-it）
      </button>
    </div>
  </div>

  <!-- Count & API -->
  <div class="card">
    <div class="card-title">生成セット数</div>
    <div class="count-row">
      <span class="count-label">何セット予測する？</span>
      <div class="count-btns">
        <button class="count-btn active" onclick="selectCount(1)" id="cnt-1">1</button>
        <button class="count-btn" onclick="selectCount(2)" id="cnt-2">2</button>
        <button class="count-btn" onclick="selectCount(3)" id="cnt-3">3</button>
        <button class="count-btn" onclick="selectCount(5)" id="cnt-5">5</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="api-row">
      <div class="api-col">
        <div class="api-col-label"><span class="api-icon">⚡</span> Groq APIキー</div>
        <div class="api-input-wrap">
          <input type="password" class="api-input api-input-half" id="groqKey" placeholder="gsk_..." />
          <button class="api-show-btn" onclick="toggleKey('groqKey', this)">表示</button>
        </div>
      </div>
      <div class="api-col">
        <div class="api-col-label"><span class="api-icon">🔷</span> Gemma APIキー</div>
        <div class="api-input-wrap">
          <input type="password" class="api-input api-input-half" id="gemmaKey" placeholder="AIza..." />
          <button class="api-show-btn" onclick="toggleKey('gemmaKey', this)">表示</button>
        </div>
      </div>
    </div>
    <p class="api-note">どちらか一方のAPIキーがあれば動作します。両方入力するとGroqを優先します。</p>
  </div>

  <!-- Generate -->
  <button class="gen-btn" id="genBtn" onclick="generate()">
    ✦ 予測を生成する ✦
  </button>

  <!-- Loading -->
  <div id="loadingArea" style="display:none;">
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>

  <!-- Error -->
  <div id="errorArea" style="display:none;" class="error-msg"></div>

  <!-- Results -->
  <div id="resultsArea" class="results-area"></div>

  <!-- Stats -->
  <div class="card" id="statsCard" style="display:none;">
    <div class="card-title" id="statsTitle">出現頻度データ</div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <div class="footer">
    LOTO LAYER — Powered by Groq API × AI<br>
    ※ このアプリは娯楽目的です。当選を保証するものではありません。
  </div>
</div>

<script>
// ===== State =====
let currentMode = 'loto6';
let currentModel = 'groq';
let currentCount = 1;

const MODES = {
  loto6: { max: 43, pick: 6, bonus: 1, name: 'ロト6', badge: 'badge-loto6' },
  loto7: { max: 37, pick: 7, bonus: 2, name: 'ロト7', badge: 'badge-loto7' },
  mini:  { max: 31, pick: 5, bonus: 1, name: 'ミニロト', badge: 'badge-mini' }
};

const MODELS = {
  groq:  'llama-3.3-70b-versatile',
  gemma: 'gemma2-9b-it'
};

const GEMMA_MODELS = ['gemma'];

// ===== Frequency data (simulated from historical patterns) =====
// Loto6: numbers 1-43, frequency weights
const FREQ_LOTO6 = [
  0,
  28,31,35,29,26,33,30,38,25,27,
  32,29,34,28,31,36,27,30,33,29,
  28,35,31,27,30,34,29,32,28,31,
  26,29,33,30,28,32,31,27,29,34,
  28,31,30
];
const FREQ_LOTO7 = [
  0,
  22,25,28,23,21,26,24,30,20,22,
  25,23,27,22,25,29,21,24,26,23,
  22,28,25,21,24,27,23,26,22,25,
  20,23,27,24,22,26,25
];
const FREQ_MINI = [
  0,
  18,21,24,19,17,22,20,26,16,18,
  21,19,23,18,21,25,17,20,22,19,
  18,24,21,17,20,23,19,22,18,21,
  16
];

function getFreq(mode) {
  if (mode === 'loto6') return FREQ_LOTO6;
  if (mode === 'loto7') return FREQ_LOTO7;
  return FREQ_MINI;
}

// ===== UI helpers =====
function selectMode(mode) {
  currentMode = mode;
  const colors = {
    loto6: { border: '#0057a8', bg: '#e8f0fb', text: '#0057a8' },
    loto7: { border: '#6b3fa0', bg: '#f0eaf8', text: '#6b3fa0' },
    mini:  { border: '#00963c', bg: '#e6f5ec', text: '#00963c' }
  };
  ['loto6','loto7','mini'].forEach(m => {
    const tab = document.getElementById('tab-'+m);
    tab.classList.toggle('active', m === mode);
    if (m === mode) {
      const c = colors[m];
      tab.style.borderColor = c.border;
      tab.style.background = c.bg;
      tab.style.color = c.text;
      tab.style.boxShadow = `0 2px 8px ${c.border}33`;
    } else {
      tab.style.borderColor = '';
      tab.style.background = '';
      tab.style.color = '';
      tab.style.boxShadow = '';
    }
  });
  renderStats();
}

function selectModel(model) {
  currentModel = model;
  ['groq','gemma'].forEach(m => {
    document.getElementById('model-'+m).classList.toggle('active', m === model);
  });
}

function selectCount(n) {
  currentCount = n;
  [1,2,3,5].forEach(c => {
    document.getElementById('cnt-'+c).classList.toggle('active', c === n);
  });
}

// ===== Ball color =====
function getBallColor(num, max, isBonus) {
  if (isBonus) return 'ball-bonus';
  const ratio = num / max;
  if (ratio <= 0.14) return 'ball-white';
  if (ratio <= 0.28) return 'ball-yellow';
  if (ratio <= 0.42) return 'ball-pink';
  if (ratio <= 0.56) return 'ball-orange';
  if (ratio <= 0.70) return 'ball-teal';
  if (ratio <= 0.84) return 'ball-blue';
  return 'ball-red';
}

// ===== Stats render =====
function renderStats() {
  const mode = MODES[currentMode];
  const freq = getFreq(currentMode);
  const max = freq.slice(1).reduce((a,b) => Math.max(a,b), 0);
  const min = freq.slice(1).reduce((a,b) => Math.min(a,b), 999);
  const range = max - min || 1;

  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  document.getElementById('statsTitle').textContent = `出現頻度データ（${mode.name} 1〜${mode.max}）`;
  document.getElementById('statsCard').style.display = '';

  for (let i = 1; i <= mode.max; i++) {
    const f = freq[i];
    const ratio = (f - min) / range;
    const r = Math.round(255 * ratio);
    const g = Math.round(100 + 155 * (1 - ratio));
    const b = Math.round(200 * (1 - ratio));
    const cell = document.createElement('div');
    cell.className = 'stat-cell';
    cell.style.background = `rgba(${r},${g},${b},0.15)`;
    cell.style.border = `1px solid rgba(${r},${g},${b},0.3)`;
    cell.innerHTML = `
      <span class="stat-num" style="color:rgb(${r},${g},${b})">${String(i).padStart(2,'0')}</span>
      <span class="stat-count">${f}</span>
      <div class="freq-bar" style="background:rgba(${r},${g},${b},0.6);width:${Math.round(ratio*100)}%"></div>
    `;
    grid.appendChild(cell);
  }
}

// ===== Weighted random pick =====
function weightedPick(mode) {
  const m = MODES[mode];
  const freq = getFreq(mode);
  const total = freq.slice(1, m.max+1).reduce((a,b) => a+b, 0);

  const picked = [];
  const available = Array.from({length: m.max}, (_,i) => i+1);

  while (picked.length < m.pick) {
    const weights = available.map(n => freq[n]);
    const wTotal = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * wTotal;
    let idx = 0;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) { idx = i; break; }
    }
    picked.push(available[idx]);
    available.splice(idx, 1);
  }

  // Bonus numbers
  const bonusNums = [];
  for (let b = 0; b < m.bonus; b++) {
    const bAvail = available.filter(n => !bonusNums.includes(n));
    const bIdx = Math.floor(Math.random() * bAvail.length);
    bonusNums.push(bAvail[bIdx]);
  }

  return { main: picked.sort((a,b)=>a-b), bonus: bonusNums.sort((a,b)=>a-b) };
}

// ===== API call =====
const GEMMA_MODELS = ['gemma2', 'gemma3'];

async function callAPI(prompt) {
  const isGemma = GEMMA_MODELS.includes(currentModel);
  const model = MODELS[currentModel];

  if (isGemma) {
    const apiKey = document.getElementById('gemmaKey').value.trim();
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { maxOutputTokens: 300, temperature: 0.8 }
      })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `Gemma API error: ${resp.status}`);
    }
    const data = await resp.json();
    return data.candidates[0].content.parts[0].text;
  } else {
    const apiKey = document.getElementById('groqKey').value.trim();
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model,
        messages: [{ role: 'user', content: prompt }],
        max_tokens: 300,
        temperature: 0.8
      })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `Groq API error: ${resp.status}`);
    }
    const data = await resp.json();
    return data.choices[0].message.content;
  }
}

// ===== Toggle key visibility =====
function toggleKey(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '隠す';
  } else {
    input.type = 'password';
    btn.textContent = '表示';
  }
}

// ===== Generate =====
async function generate() {
  const groqKey = document.getElementById('groqKey').value.trim();
  const gemmaKey = document.getElementById('gemmaKey').value.trim();
  if (!groqKey && !gemmaKey) {
    showError('GroqまたはGemmaのAPIキーを入力してください');
    return;
  }
  // Groq優先: groqKeyがあればgroq、なければgemma
  if (groqKey) {
    currentModel = 'groq';
    document.getElementById('model-groq').classList.add('active');
    document.getElementById('model-gemma').classList.remove('active');
  } else {
    currentModel = 'gemma';
    document.getElementById('model-gemma').classList.add('active');
    document.getElementById('model-groq').classList.remove('active');
  }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  document.getElementById('loadingArea').style.display = '';
  document.getElementById('errorArea').style.display = 'none';
  document.getElementById('resultsArea').innerHTML = '';

  const mode = MODES[currentMode];
  const sets = [];
  for (let i = 0; i < currentCount; i++) {
    sets.push(weightedPick(currentMode));
  }

  // Render balls immediately
  const resultsArea = document.getElementById('resultsArea');
  sets.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'result-set';
    div.id = `set-${i}`;
    div.innerHTML = `
      <div class="result-set-header">
        <span class="set-label">SET ${i+1}</span>
        <span class="set-type-badge ${mode.badge}">${mode.name}</span>
      </div>
      <div class="balls-row" id="balls-${i}">
        ${s.main.map((n, bi) => `
          <div class="ball-wrapper" style="animation-delay:${bi*0.08}s">
            <div class="ball ${getBallColor(n, mode.max, false)}" style="animation-delay:${bi*0.08}s">${String(n).padStart(2,'0')}</div>
          </div>
        `).join('')}
        ${s.bonus.map((n, bi) => `
          <div class="ball-wrapper" style="animation-delay:${(s.main.length+bi)*0.08}s">
            <div class="ball ball-bonus" style="animation-delay:${(s.main.length+bi)*0.08}s">B${String(n).padStart(2,'0')}</div>
          </div>
        `).join('')}
      </div>
      <div id="comment-${i}">
        <div class="loading-dots" style="padding:10px 0">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
        </div>
      </div>
    `;
    resultsArea.appendChild(div);
  });

  document.getElementById('loadingArea').style.display = 'none';

  // AI comments for each set
  for (let i = 0; i < sets.length; i++) {
    const s = sets[i];
    const freq = getFreq(currentMode);
    const freqInfo = s.main.map(n => `${n}番(出現${freq[n]}回)`).join('、');
    const prompt = `あなたは宝くじ予測AIです。${mode.name}の予測数字について、運気・統計・直感を絡めた面白いコメントを日本語で2〜3文で書いてください。数字: ${s.main.join(', ')}（ボーナス: ${s.bonus.join(', ')}）。頻度データ: ${freqInfo}。楽しく前向きなトーンで。`;

    try {
      const comment = await callAPI(prompt);
      document.getElementById(`comment-${i}`).innerHTML = `
        <div class="ai-comment">
          <div class="ai-comment-header">AI予測コメント — ${MODELS[currentModel]}</div>
          ${comment.trim()}
        </div>
      `;
    } catch(e) {
      document.getElementById(`comment-${i}`).innerHTML = `
        <div class="ai-comment">
          <div class="ai-comment-header">AI予測コメント</div>
          ⚠️ コメント生成エラー: ${e.message}
        </div>
      `;
    }
  }

  btn.disabled = false;
}

function showError(msg) {
  const el = document.getElementById('errorArea');
  el.textContent = msg;
  el.style.display = '';
  document.getElementById('loadingArea').style.display = 'none';
  document.getElementById('genBtn').disabled = false;
}


// ===== Background Ball Animation =====
(function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');

  const BALL_COLORS = [
    ['#b8d8ff','#0057a8'],
    ['#b8f0d8','#00963c'],
    ['#d8c0f8','#6b3fa0'],
    ['#ffe0b0','#cc7700'],
    ['#ffc0c0','#cc2222'],
    ['#c0e8ff','#0077cc'],
    ['#d0f8e0','#007744'],
    ['#e8d0ff','#552299'],
  ];

  let balls = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeBall() {
    const r = 14 + Math.random() * 18;
    const col = BALL_COLORS[Math.floor(Math.random() * BALL_COLORS.length)];
    const num = Math.floor(Math.random() * 43) + 1;
    return {
      x: Math.random() * W,
      y: H + r + Math.random() * H,
      r,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -(0.6 + Math.random() * 1.2),
      col,
      num,
      alpha: 0.15 + Math.random() * 0.45,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.03,
    };
  }

  function init() {
    balls = [];
    for (let i = 0; i < 18; i++) {
      const b = makeBall();
      b.y = Math.random() * H;
      balls.push(b);
    }
  }

  function drawBall(b) {
    ctx.save();
    ctx.globalAlpha = b.alpha;
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);

    // Ball body
    const grad = ctx.createRadialGradient(-b.r*0.3, -b.r*0.3, b.r*0.05, 0, 0, b.r);
    grad.addColorStop(0, b.col[0]);
    grad.addColorStop(1, b.col[1]);
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Shine
    ctx.beginPath();
    ctx.ellipse(-b.r*0.25, -b.r*0.3, b.r*0.35, b.r*0.2, -0.5, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();

    // Number
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.font = `bold ${Math.round(b.r*0.7)}px 'Orbitron', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(b.num).padStart(2,'0'), 0, 1);

    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    balls.forEach((b, i) => {
      b.x += b.vx;
      b.y += b.vy;
      b.rot += b.rotV;
      if (b.y < -b.r * 2) {
        balls[i] = makeBall();
      }
      drawBall(b);
    });
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => { resize(); init(); });
  resize();
  init();
  animate();
})();

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loto Layer - 宝くじ予測</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0057a8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  :root {
    --bg: #f0f4fa;
    --panel: #ffffff;
    --border: #dde4f0;
    --blue: #0057a8;
    --blue2: #0073d1;
    --blue-light: #e8f0fb;
    --green: #00963c;
    --green-light: #e6f5ec;
    --purple: #6b3fa0;
    --purple-light: #f0eaf8;
    --gold: #c8960a;
    --gold2: #e6aa00;
    --red: #d42020;
    --text: #1a1a2e;
    --muted: #6b7a99;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #eef2f9;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Canvas background for flying balls */
  #bgCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.18;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 100% 40% at 50% 0%, rgba(0,87,168,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 30px 0 24px;
  }

  .header-ball {
    width: 90px;
    height: 90px;
    margin: 0 auto 16px;
  }

  .header-ball svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 16px rgba(0,87,168,0.35)) drop-shadow(0 2px 6px rgba(0,0,0,0.15));
    animation: ballBounce 2.4s ease-in-out infinite;
  }

  @keyframes ballBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, #0057a8, #0088ee, #00963c, #6b3fa0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }

  .header p {
    color: #6b7a99;
    font-size: 0.85rem;
    margin-top: 6px;
    letter-spacing: 0.05em;
  }

  /* Section card */
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,87,168,0.07);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }

  .card-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--blue);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: var(--blue);
    border-radius: 2px;
    display: inline-block;
  }

  /* Mode selector */
  .mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .mode-tabs-5 {
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
  }
  .mode-tabs-5 .mode-tab {
    padding: 10px 4px;
  }
  .mode-tabs-5 .tab-name {
    font-size: 0.7rem;
  }
  .mode-tabs-5 .tab-desc {
    font-size: 0.62rem;
  }

  .mode-tab {
    background: #f5f7fc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
  }

  .mode-tab .tab-name {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }

  .mode-tab .tab-desc {
    font-size: 0.7rem;
    display: block;
  }

  .mode-tab.active {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue);
    box-shadow: 0 2px 8px rgba(0,87,168,0.15);
  }

  /* Model selector */
  .model-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .model-btn {
    background: #f5f7fc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.8rem;
    text-align: left;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .model-btn .model-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  .model-btn.active {
    border-color: var(--blue2);
    background: var(--blue-light);
    color: var(--blue);
  }

  .model-btn.active .model-dot {
    background: var(--blue2);
    box-shadow: 0 0 6px rgba(0,115,209,0.5);
  }

  /* Count selector */
  .count-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .count-label {
    color: #6b7a99;
    font-size: 0.85rem;
    flex: 1;
  }

  .count-btns {
    display: flex;
    gap: 6px;
  }

  .count-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #f5f7fc;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    transition: all 0.2s;
  }

  .count-btn.active {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue);
  }

  /* API Key */
  .api-input {
    width: 100%;
    background: #f5f7fc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .api-input:focus { border-color: var(--blue2); }
  .api-input::placeholder { color: var(--muted); }

  /* Generate button */
  .gen-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #004a99, #0067cc, #0088ee, #0067cc, #004a99);
    background-size: 200% 200%;
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,40,0.3);
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    animation: shimmerBg 3s ease infinite;
  }

  @keyframes shimmerBg {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .gen-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,87,168,0.4); }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Results */
  .results-area { margin-top: 0; }

  .result-set {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(0,87,168,0.07);
    animation: fadeInUp 0.4s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-set-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .set-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .set-type-badge {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 20px;
    font-family: 'Orbitron', monospace;
    letter-spacing: 0.05em;
  }

  .badge-loto6 { background: #e8f0fb; color: #0057a8; border: 1px solid #b8d0f0; }
  .badge-loto7 { background: #f0eaf8; color: #6b3fa0; border: 1px solid #d0b8f0; }
  .badge-mini  { background: #e6f5ec; color: #00963c; border: 1px solid #a8dfc0; }
  .badge-num3  { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
  .badge-num4  { background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }

  /* Lottery balls */
  .balls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    justify-content: center;
  }

  .ball {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    position: relative;
    animation: ballPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    flex-shrink: 0;
  }

  @keyframes ballPop {
    from { transform: scale(0) rotate(-30deg); opacity: 0; }
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .ball::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 10px;
    width: 14px;
    height: 8px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    transform: rotate(-30deg);
  }

  /* Ball colors by range */
  .ball-white { background: radial-gradient(circle at 35% 35%, #fff, #ccc); color: #333; }
  .ball-yellow { background: radial-gradient(circle at 35% 35%, #ffe066, #cc9900); color: #222; }
  .ball-pink   { background: radial-gradient(circle at 35% 35%, #ff8ec6, #cc3377); color: #fff; }
  .ball-orange { background: radial-gradient(circle at 35% 35%, #ffa040, #cc5500); color: #fff; }
  .ball-teal   { background: radial-gradient(circle at 35% 35%, #40ffe0, #009977); color: #fff; }
  .ball-blue   { background: radial-gradient(circle at 35% 35%, #70aaff, #2244cc); color: #fff; }
  .ball-red    { background: radial-gradient(circle at 35% 35%, #ff6666, #cc0000); color: #fff; }


  .ball-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* AI comment */
  .ai-comment {
    background: #f0f4fa;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.88rem;
    color: #111111;
    line-height: 1.7;
    font-weight: 500;
  }

  .ai-comment-header {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    color: var(--blue);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ai-comment-header::before {
    content: '✦';
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 4px;
  }

  .stat-cell {
    border-radius: 6px;
    padding: 4px 2px;
    text-align: center;
    cursor: default;
    transition: transform 0.15s;
  }

  .stat-cell:hover { transform: scale(1.1); }

  .stat-num {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    display: block;
  }

  .stat-count {
    font-size: 0.6rem;
    color: var(--muted);
    display: block;
  }

  /* Loading */
  .loading-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 20px;
  }

  .loading-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    animation: dotBounce 1.2s ease infinite;
  }

  .loading-dot:nth-child(2) { animation-delay: 0.2s; background: var(--green); }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; background: var(--purple); }

  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Error */
  .error-msg {
    background: #fff0f0;
    border: 1px solid #ffcccc;
    border-radius: 10px;
    padding: 12px;
    color: var(--red);
    font-size: 0.83rem;
    margin-bottom: 12px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding-top: 20px;
    color: #8899bb;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
  }

  /* Frequency bar */
  .freq-bar {
    height: 3px;
    border-radius: 2px;
    margin-top: 3px;
  }

  select.api-input {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  /* API row */
  .api-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 10px;
  }

  .api-col-label {
    font-size: 0.75rem;
    color: var(--blue);
    margin-bottom: 6px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .api-input-wrap {
    display: flex;
    gap: 4px;
  }

  .api-input-half {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    font-size: 0.8rem;
  }

  .api-show-btn {
    background: #e8edf7;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.72rem;
    padding: 0 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .api-show-btn:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text);
  }

  .api-note {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.5;
  }

  /* Numbers form */
  .numbers-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .nf-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nf-label {
    font-size: 0.78rem;
    color: var(--blue);
    font-weight: 700;
  }

  /* Permutation list */
  .perm-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .perm-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #f5f7fc;
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: background 0.2s;
  }

  .perm-row-top {
    background: #e8f0fb;
    border-color: var(--blue);
    box-shadow: 0 2px 8px rgba(0,87,168,0.1);
  }

  .perm-rank {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    width: 20px;
    flex-shrink: 0;
  }

  .perm-row-top .perm-rank {
    color: var(--blue);
    font-weight: 700;
  }

  .perm-balls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .perm-ball {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    font-weight: 700;
    background: #dde4f0;
    color: #6b7a99;
  }

  .perm-ball-lucky {
    background: radial-gradient(circle at 35% 35%, #4da8ff, #0044aa);
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,87,168,0.3);
  }

  .perm-row-top .perm-ball-lucky {
    box-shadow: 0 3px 10px rgba(0,87,168,0.4);
  }

  .perm-section-title {
    font-size: 0.78rem;
    color: var(--blue);
    font-weight: 700;
    margin: 14px 0 8px;
    letter-spacing: 0.02em;
  }

  .perm-sep {
    color: var(--muted);
    font-size: 1rem;
  }

  /* Numbers result balls */
  .numbers-balls-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 12px;
  }

  .num-ball {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 1.3rem;
    font-weight: 900;
    background: radial-gradient(circle at 35% 35%, #4da8ff, #0044aa);
    color: #fff;
    box-shadow: 0 4px 12px rgba(0,87,168,0.3);
    position: relative;
    animation: ballPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }

  .num-ball::after {
    content: '';
    position: absolute;
    top: 7px;
    left: 11px;
    width: 14px;
    height: 8px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    transform: rotate(-30deg);
  }

  .num-dash {
    display: flex;
    align-items: center;
    font-size: 1.5rem;
    color: var(--muted);
    font-weight: 300;
  }


</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-ball">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="hbg" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#4da8ff"/>
            <stop offset="100%" stop-color="#0044aa"/>
          </radialGradient>
          <radialGradient id="shine" cx="30%" cy="25%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- Shadow -->
        <ellipse cx="50" cy="93" rx="28" ry="6" fill="rgba(0,0,0,0.12)"/>
        <!-- Main ball -->
        <circle cx="50" cy="48" r="44" fill="url(#hbg)"/>
        <!-- White equator band -->
        <ellipse cx="50" cy="48" rx="44" ry="13" fill="#ffffff" opacity="0.95"/>
        <!-- Shine -->
        <ellipse cx="36" cy="30" rx="15" ry="10" fill="url(#shine)" transform="rotate(-25 36 30)"/>
        <!-- Number on band -->
        <text x="50" y="54" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#0044aa">LOTO</text>
      </svg>
    </div>
    <h1>LOTO LAYER</h1>
    <p>統計 × AI 予測 ｜ ロト6 / ロト7 / ミニロト / ナンバーズ</p>
  </div>

  <!-- Mode Select -->
  <div class="card">
    <div class="card-title">ロトの種類</div>
    <div class="mode-tabs mode-tabs-5">
      <button class="mode-tab active" onclick="selectMode('loto6')" id="tab-loto6">
        <span class="tab-name">L6</span>
        <span class="tab-desc">1〜43</span>
      </button>
      <button class="mode-tab" onclick="selectMode('loto7')" id="tab-loto7">
        <span class="tab-name">L7</span>
        <span class="tab-desc">1〜37</span>
      </button>
      <button class="mode-tab" onclick="selectMode('mini')" id="tab-mini">
        <span class="tab-name">MINI</span>
        <span class="tab-desc">1〜31</span>
      </button>
      <button class="mode-tab" onclick="selectMode('num3')" id="tab-num3">
        <span class="tab-name">N3</span>
        <span class="tab-desc">数秘術</span>
      </button>
      <button class="mode-tab" onclick="selectMode('num4')" id="tab-num4">
        <span class="tab-name">N4</span>
        <span class="tab-desc">数秘術</span>
      </button>
    </div>
  </div>

  <!-- Numbers input card (shown only for num3/num4) -->
  <div class="card" id="numbersInputCard" style="display:none;">
    <div class="card-title">抽選日を選択</div>
    <div class="numbers-form">
      <div class="nf-row">
        <label class="nf-label">抽選日</label>
        <input type="date" class="api-input" id="drawDate" />
      </div>
    </div>
    <p class="api-note" style="margin-top:8px;">※ 月齢・九星気学・曜日を組み合わせてその日のラッキーナンバーを導き出します</p>
  </div>

  <!-- API key card -->
  <div class="card">
    <div class="card-title">Groq API キー</div>
    <div class="api-input-wrap">
      <input type="password" class="api-input" id="groqKey" placeholder="gsk_..." />
      <button class="api-show-btn" onclick="toggleKey('groqKey', this)">表示</button>
    </div>

<script>
// ===== State =====
let currentMode = 'loto6';
let currentModel = 'groq';
let currentCount = 1;

const MODES = {
  loto6: { max: 43, pick: 6, name: 'ロト6', badge: 'badge-loto6' },

const MODELS = {

// ===== Frequency data (simulated from historical patterns) =====
// Loto6: numbers 1-43, frequency weights
const FREQ_LOTO6 = [
  0,
  28,31,35,29,26,33,30,38,25,27,
  32,29,34,28,31,36,27,30,33,29,

const FREQ_LOTO7 = [

const FREQ_MINI = [

function getFreq(mode) {

}

// ===== UI helpers =====
function selectMode(mode) {

    loto6: { border: '#0057a8', bg: '#e8f0fb', text: '#0057a8' },

function selectModel(model) {

function selectCount(n) {

// ===== Ball color =====
function getBallColor(num, max, isBonus) {
  if (isBonus) return 'ball-bonus';
  const ratio = num / max;
  if (ratio <= 0.14) return 'ball-white';
  if (ratio <= 0.28) return 'ball-yellow';
  if (ratio <= 0.42) return 'ball-pink';
  if (ratio <= 0.56) return 'ball-orange';
  if (ratio <= 0.70) return 'ball-teal';
  if (ratio <= 0.84) return 'ball-blue';
  return 'ball-red';
}

// ===== Stats render =====
function renderStats() {
  const mode = MODES[currentMode];
  const freq = getFreq(currentMode);
  const max = freq.slice(1).reduce((a,b) => Math.max(a,b), 0);
  const min = freq.slice(1).reduce((a,b) => Math.min(a,b), 999);
  const range = max - min || 1;

  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  document.getElementById('statsTitle').textContent = `出現頻度データ（${mode.name} 1〜${mode.max}）`;
  document.getElementById('statsCard').style.display = '';

  for (let i = 1; i <= mode.max; i++) {
    const f = freq[i];
    const ratio = (f - min) / range;
    const r = Math.round(255 * ratio);
    const g = Math.round(100 + 155 * (1 - ratio));
    const b = Math.round(200 * (1 - ratio));
    const cell = document.createElement('div');
    cell.className = 'stat-cell';
    cell.style.background = `rgba(${r},${g},${b},0.15)`;
    cell.style.border = `1px solid rgba(${r},${g},${b},0.3)`;
    cell.innerHTML = `
      <span class="stat-num" style="color:rgb(${r},${g},${b})">${String(i).padStart(2,'0')}</span>
      <span class="stat-count">${f}</span>
      <div class="freq-bar" style="background:rgba(${r},${g},${b},0.6);width:${Math.round(ratio*100)}%"></div>
    `;
    grid.appendChild(cell);
  }
}

// ===== Weighted random pick =====
function weightedPick(mode) {
  const m = MODES[mode];
  const freq = getFreq(mode);
  const total = freq.slice(1, m.max+1).reduce((a,b) => a+b, 0);

  const picked = [];
  const available = Array.from({length: m.max}, (_,i) => i+1);

  while (picked.length < m.pick) {
    const weights = available.map(n => freq[n]);
    const wTotal = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * wTotal;
    let idx = 0;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) { idx = i; break; }
    }
    picked.push(available[idx]);
    available.splice(idx, 1);
  }

  return { main: picked.sort((a,b)=>a-b) };
}

// ===== API call =====
async function callAPI(prompt) {
  const apiKey = document.getElementById('groqKey').value.trim();
  const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: MODELS['groq'],
      messages: [{ role: 'user', content: prompt }],
      max_tokens: 1200,
      temperature: 0.8
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `Groq API error: ${resp.status}`);
  }
  const data = await resp.json();
  return data.choices[0].message.content;
}

  } else {
    input.type = 'password';

  }
}

// ===== Numbers prediction =====
// ===== 全順列生成 =====
function permutations(arr) {
  if (arr.length <= 1) return [arr];
  const result = [];
  for (let i = 0; i < arr.length; i++) {
    const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
    for (const perm of permutations(rest)) {
      result.push([arr[i], ...perm]);
    }
  }
  return result;
}

// 吉数の優先度スコアで並び替え（吉数が先頭に来るほど高スコア）
function scorePermutation(perm, luckyNums) {
  let score = 0;
  perm.forEach((d, i) => {
    const luckyRank = luckyNums.indexOf(d);
    if (luckyRank !== -1) {
      // 先頭に近いほど高スコア、吉数の順位も考慮
      score += (perm.length - i) * 10 + (luckyNums.length - luckyRank);
    }
  });
  return score;
}

// ===== 組み合わせ生成（ボックス用・重複あり）=====
function combinationsWithRepeat(arr, r) {
  if (r === 0) return [[]];
  const result = [];
  for (let i = 0; i < arr.length; i++) {
    const rest = combinationsWithRepeat(arr.slice(i), r - 1);
    for (const c of rest) {
      result.push([arr[i], ...c]);
    }
  }
  return result;
}

// ===== 月齢計算 =====
function getMoonAge(date) {
  // 既知の新月日からの経過日数で月齢を計算
  const knownNewMoon = new Date(2000, 0, 6); // 2000年1月6日が新月
  const diff = (date - knownNewMoon) / (1000 * 60 * 60 * 24);
  const moonCycle = 29.53059;
  const age = diff % moonCycle;
  return Math.round((age < 0 ? age + moonCycle : age) * 10) / 10;
}

function getMoonPhase(age) {
  if (age < 1.85) return '新月（再生・新スタート）';
  if (age < 7.38) return '三日月（成長・積み上げ）';
  if (age < 9.22) return '上弦の月（決断・行動）';
  if (age < 14.77) return '十三夜（加速・充実）';
  if (age < 16.61) return '満月（完成・感謝・直感最大）';
  if (age < 22.15) return '十六夜（手放し・整理）';
  if (age < 23.99) return '下弦の月（内省・見直し）';
  return '晦日月（浄化・準備）';
}

// ===== 九星計算 =====
function getKyusei(date) {
  // 九星気学：年の九星（節分基準）
  const year = date.getMonth() < 1 || (date.getMonth() === 1 && date.getDate() < 4)
    ? date.getFullYear() - 1 : date.getFullYear();
  const base = (11 - ((year - 1) % 9)) % 9;
  const yearStar = base === 0 ? 9 : base;

  // 日の九星
  const epoch = new Date(1899, 0, 21); // 一白水星の基準日
  const dayDiff = Math.floor((date - epoch) / (1000 * 60 * 60 * 24));
  const dayStarNum = ((8 - (dayDiff % 9)) % 9) + 1;

  const stars = ['','一白水星','二黒土星','三碧木星','四緑木星','五黄土星','六白金星','七赤金星','八白土星','九紫火星'];
  const luckyNums = {1:[1,6], 2:[2,5,8], 3:[3,4], 4:[3,4], 5:[2,5,8], 6:[6,7], 7:[6,7], 8:[2,5,8], 9:[9]};

  return {
    yearStar: stars[yearStar],
    dayStar: stars[dayStarNum],
    luckyNums: [...new Set([...luckyNums[yearStar], ...luckyNums[dayStarNum]])]
  };
}

// ===== 曜日の吉数 =====
function getDayLucky(date) {
  const dayNames = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
  const dayLucky = {
    0: { nums: [0,9], reason: '日曜：太陽の日。完全数9と循環の0が吉' },
    1: { nums: [1,7], reason: '月曜：月の日。新しい始まり1と幸運7が吉' },
    2: { nums: [2,8], reason: '火曜：火星の日。対極2と繁栄8が吉' },
    3: { nums: [3,6], reason: '水曜：水星の日。創造3と調和6が吉' },
    4: { nums: [4,5], reason: '木曜：木星の日。安定4と変化5が吉' },
    5: { nums: [5,8], reason: '金曜：金星の日。変化5と豊穣8が吉' },
    6: { nums: [3,7], reason: '土曜：土星の日。創造3と幸運7が吉' }
  };
  const dow = date.getDay();
  return { dayName: dayNames[dow], ...dayLucky[dow] };
}

async function generateNumbers() {
  const drawDateVal = document.getElementById('drawDate').value;
  if (!drawDateVal) {
    showError('抽選日を選択してください');
    return;
  }

  const mode = MODES[currentMode];
  const drawDate = new Date(drawDateVal + 'T12:00:00');

  // ===== Validate draw date =====
  const dow = drawDate.getDay();
  const mon = drawDate.getMonth() + 1;
  const day = drawDate.getDate();

  if (dow === 0 || dow === 6) {
    showError('土日は抽選が行われません。月〜金曜日を選択してください。');
    return;
  }
  if ((mon === 12 && day === 31) || (mon === 1 && (day >= 1 && day <= 3))) {
    showError('年末年始（12月31日〜1月3日）は抽選が行われません。');
    return;
  }

  // Calculate moon age, kyusei, day lucky
  const moonAge = getMoonAge(drawDate);
  const moonPhase = getMoonPhase(moonAge);
  const kyusei = getKyusei(drawDate);
  const dayLucky = getDayLucky(drawDate);
  const dateStr = `${drawDate.getFullYear()}年${drawDate.getMonth()+1}月${drawDate.getDate()}日（${dayLucky.dayName}）`;

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  document.getElementById('loadingArea').style.display = '';
  document.getElementById('errorArea').style.display = 'none';
  document.getElementById('resultsArea').innerHTML = '';

  // ===== Step1: 番号だけ先に生成 =====
  const prompt1 = `あなたは月齢・九星気学・曜日吉数の専門家です。以下の情報をもとに${mode.name}（${mode.digits}桁、各桁0〜9のストレート）の予測番号を1行だけ出力してください。

【抽選日情報】
・日付：${dateStr}
・月齢：${moonAge}日（${moonPhase}）
・年の九星：${kyusei.yearStar}
・日の九星：${kyusei.dayStar}
・九星の吉数：${kyusei.luckyNums.join('、')}
・曜日の吉数：${dayLucky.nums.join('、')}（${dayLucky.reason}）

出力形式：予測番号：X-X-X${mode.digits===4?'-X':''}
（Xは0〜9の数字、この1行のみ出力）`;

  try {
    const result1 = await callAPI(prompt1);

    // Extract digits
    const m = result1.match(/[0-9]-[0-9]-[0-9](?:-[0-9])?/);
    let digits = [];
    if (m) {
      digits = m[0].split('-').map(Number);
    }
    if (digits.length < mode.digits) {
      const pool = [...kyusei.luckyNums, ...dayLucky.nums];
      digits = Array.from({length: mode.digits}, (_, i) => pool[i % pool.length]);
    }

    // ===== 全順列を優先度順に並べる =====
    const allPerms = permutations(digits);
    const luckyPool = [...new Set([...kyusei.luckyNums, ...dayLucky.nums])];
    allPerms.sort((a, b) => scorePermutation(b, luckyPool) - scorePermutation(a, luckyPool));

    // ===== ボールを先に表示 =====
    const resultsArea = document.getElementById('resultsArea');
    const div = document.createElement('div');
    div.className = 'result-set';
    div.id = 'numbers-result';
    div.innerHTML = `
      <div class="result-set-header">
        <span class="set-label">${dateStr}</span>
        <span class="set-type-badge ${mode.badge}">${mode.name}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <span style="font-size:0.7rem;padding:3px 8px;background:#e8f0fb;color:#0057a8;border-radius:20px;border:1px solid #b8d0f0;">🌙 月齢${moonAge}日</span>
        <span style="font-size:0.7rem;padding:3px 8px;background:#f0eaf8;color:#6b3fa0;border-radius:20px;border:1px solid #d0b8f0;">${kyusei.dayStar}</span>
        <span style="font-size:0.7rem;padding:3px 8px;background:#e6f5ec;color:#00963c;border-radius:20px;border:1px solid #a8dfc0;">吉数：${luckyPool.join('・')}</span>
      </div>
      <div class="perm-section-title">🎯 ストレート（全順列・当たりやすい順）</div>
      <div class="perm-list">
        ${allPerms.map((perm, idx) => `
          <div class="perm-row ${idx === 0 ? 'perm-row-top' : ''}">
            <span class="perm-rank">${idx + 1}</span>
            <div class="perm-balls">
              ${perm.map((d, i) => `
                <div class="perm-ball ${luckyPool.includes(d) ? 'perm-ball-lucky' : ''}">${d}</div>
                ${i < perm.length - 1 ? '<span class="perm-sep">–</span>' : ''}
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      <div class="perm-section-title">📦 ボックス（吉数から${mode.digits}桁・重複あり・小さい順・上位20通り）</div>
      <div class="perm-list">
        ${combinationsWithRepeat(luckyPool.slice(0, Math.min(luckyPool.length, 6)), mode.digits)
          .map(c => [...c].sort((a,b) => a-b))
          .filter((c, i, arr) => arr.findIndex(x => x.join('-') === c.join('-')) === i)
          .sort((a, b) => {
            // 吉数が多く含まれる順、同じなら小さい数字優先
            const aScore = a.filter(d => luckyPool.includes(d)).length;
            const bScore = b.filter(d => luckyPool.includes(d)).length;
            if (bScore !== aScore) return bScore - aScore;
            for (let i = 0; i < a.length; i++) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          })
          .slice(0, 20)
          .map((combo, idx) => `
            <div class="perm-row">
              <span class="perm-rank">${idx + 1}</span>
              <div class="perm-balls">
                ${combo.map((d, i) => `
                  <div class="perm-ball perm-ball-lucky">${d}</div>
                  ${i < combo.length - 1 ? '<span class="perm-sep">–</span>' : ''}
                `).join('')}
              </div>
            </div>
          `).join('')}
      </div>
      <div id="numbers-comment">
        <div class="loading-dots" style="padding:10px 0">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
        </div>
      </div>
    `;
    resultsArea.appendChild(div);
    document.getElementById('loadingArea').style.display = 'none';

    // ===== Step2: 解説を生成 =====
    const prompt2 = `あなたは月齢・九星気学・曜日吉数の専門家です。以下の情報と予測番号をもとに、根拠の解説を日本語で書いてください。

【抽選日情報】
・日付：${dateStr}
・月齢：${moonAge}日（${moonPhase}）
・年の九星：${kyusei.yearStar}
・日の九星：${kyusei.dayStar}
・九星の吉数：${kyusei.luckyNums.join('、')}
・曜日の吉数：${dayLucky.nums.join('、')}（${dayLucky.reason}）
・予測番号：${digits.join('-')}

【解説の構成】
1. 月齢フェーズの特性（2〜3文）
2. 九星気学の組み合わせと吉数（2〜3文）
3. 曜日吉数との総合判断（2〜3文）
4. なぜこの番号になったか（1〜2文）

番号の導出理由が明確になるよう解説してください。`;

    try {
      const result2 = await callAPI(prompt2);
      document.getElementById('numbers-comment').innerHTML = `
        <div class="ai-comment">
          <div class="ai-comment-header">✦ 月齢×九星×曜日 総合解説 — llama-3.3-70b</div>
          <div style="color:#111;font-size:0.85rem;line-height:1.7;">${result2.trim().split('\n').join('<br>')}</div>
        </div>
      `;
    } catch(e) {
      document.getElementById('numbers-comment').innerHTML = `
        <div class="ai-comment">
          <div class="ai-comment-header">✦ 解説</div>
          <div style="color:#111;font-size:0.85rem;">⚠️ 解説生成エラー: ${e.message}</div>
        </div>
      `;
    }

  } catch(e) {
    showError('エラー: ' + e.message);
    document.getElementById('loadingArea').style.display = 'none';
  }
  document.getElementById('loadingArea').style.display = 'none';
  btn.disabled = false;
}

// ===== Extract Japanese text from AI response =====
function extractJapanese(text) {
  // Remove markdown bold markers like **word**
  text = text.replace(/\*\*[^*]+\*\*/g, '');
  // Remove lines starting with * or containing thinking keywords
  const skipPatterns = ['Draft', 'Selection:', 'Constraint', 'Role:', 'Task:', 'Goal:', 'Format:', 'Tone:', 'Note:', 'Numbers:', 'Frequency', 'Statistics', 'Luck', 'Intuition', 'Too plain', 'Better', 'Good,', 'Also good', 'sentences?', 'Japanese?', 'thinking'];
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const jpLines = [];
  for (const line of lines) {
    // Skip lines with thinking markers
    const hasSkip = skipPatterns.some(p => line.includes(p));
    if (hasSkip) continue;
    // Remove leading * - characters
    const cleaned = line.replace(/^[\*\-•]+\s*/, '').trim();
    if (!cleaned) continue;
    // Count Japanese characters
    const jpChars = (cleaned.match(/[\u3040-\u9fff]/g) || []).length;
    const ratio = jpChars / cleaned.length;
    if (ratio >= 0.25) {
      jpLines.push(cleaned);
    }
  }
  if (jpLines.length > 0) return jpLines.join('<br>');
  // Fallback: extract Japanese sentences directly
  const jpSentences = text.match(/[\u3040-\u9fff][^。！？]*[。！？]/g) || [];
  if (jpSentences.length > 0) return jpSentences.slice(0, 3).join('');
  return text.trim();
}

// ===== Generate =====
async function generate() {
  // Route to numbers generator if needed
  if (currentMode === 'num3' || currentMode === 'num4') {
    return generateNumbers();
  }

  const groqKey = document.getElementById('groqKey').value.trim();
  if (!groqKey) {
    showError('Groq APIキーを入力してください');
    return;
  }
  currentModel = 'groq';

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  document.getElementById('loadingArea').style.display = '';
  document.getElementById('errorArea').style.display = 'none';
  document.getElementById('resultsArea').innerHTML = '';

  const mode = MODES[currentMode];
  const sets = [];
  for (let i = 0; i < currentCount; i++) {
    sets.push(weightedPick(currentMode));
  }

  // Render balls immediately
  const resultsArea = document.getElementById('resultsArea');
  sets.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'result-set';
    div.id = `set-${i}`;
    div.innerHTML = `
      <div class="result-set-header">
        <span class="set-label">SET ${i+1}</span>
        <span class="set-type-badge ${mode.badge}">${mode.name}</span>
      </div>
      <div class="balls-row" id="balls-${i}">
        ${s.main.map((n, bi) => `
          <div class="ball-wrapper" style="animation-delay:${bi*0.08}s">
            <div class="ball ${getBallColor(n, mode.max, false)}" style="animation-delay:${bi*0.08}s">${String(n).padStart(2,'0')}</div>
          </div>
        `).join('')}

      </div>
      <div id="comment-${i}">
        <div class="loading-dots" style="padding:10px 0">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
        </div>
      </div>
    `;
    resultsArea.appendChild(div);
  });

  document.getElementById('loadingArea').style.display = 'none';

  // AI comments for each set
  for (let i = 0; i < sets.length; i++) {
    const s = sets[i];
    const freq = getFreq(currentMode);
    const freqInfo = s.main.map(n => `${n}番(出現${freq[n]}回)`).join('、');
    const prompt = `以下のロト予測数字について、運気・統計・直感を絡めた楽しいコメントを日本語で2〜3文だけ書いてください。思考過程や下書きは不要です。日本語のコメント文のみ出力してください。
数字: ${s.main.join(', ')}（${mode.name}）
頻度データ: ${freqInfo}`;

    try {
      const rawComment = await callAPI(prompt);
      const comment = extractJapanese(rawComment);
      document.getElementById(`comment-${i}`).innerHTML = `
        <div class="ai-comment">
          <div class="ai-comment-header">AI予測コメント — llama-3.3-70b</div>
          ${comment}
        </div>
      `;
    } catch(e) {
      document.getElementById(`comment-${i}`).innerHTML = `
        <div class="ai-comment">
          <div class="ai-comment-header">AI予測コメント</div>
          ⚠️ コメント生成エラー: ${e.message}
        </div>
      `;
    }
  }

  btn.disabled = false;
}

function showError(msg) {
  const el = document.getElementById('errorArea');
  el.textContent = msg;
  el.style.display = '';
  document.getElementById('loadingArea').style.display = 'none';
  document.getElementById('genBtn').disabled = false;
}


// ===== Background Ball Animation =====
(function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');

  const BALL_COLORS = [
    ['#b8d8ff','#0057a8'],
    ['#b8f0d8','#00963c'],
    ['#d8c0f8','#6b3fa0'],
    ['#ffe0b0','#cc7700'],
    ['#ffc0c0','#cc2222'],
    ['#c0e8ff','#0077cc'],
    ['#d0f8e0','#007744'],
    ['#e8d0ff','#552299'],
  ];

  let balls = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeBall() {
    const r = 14 + Math.random() * 18;
    const col = BALL_COLORS[Math.floor(Math.random() * BALL_COLORS.length)];
    const num = Math.floor(Math.random() * 43) + 1;
    return {
      x: Math.random() * W,
      y: H + r + Math.random() * H,
      r,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -(0.6 + Math.random() * 1.2),
      col,
      num,
      alpha: 0.15 + Math.random() * 0.45,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.03,
    };
  }

  function init() {
    balls = [];
    for (let i = 0; i < 18; i++) {
      const b = makeBall();
      b.y = Math.random() * H;
      balls.push(b);
    }
  }

  function drawBall(b) {
    ctx.save();
    ctx.globalAlpha = b.alpha;
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);

    // Ball body
    const grad = ctx.createRadialGradient(-b.r*0.3, -b.r*0.3, b.r*0.05, 0, 0, b.r);
    grad.addColorStop(0, b.col[0]);
    grad.addColorStop(1, b.col[1]);
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Shine
    ctx.beginPath();
    ctx.ellipse(-b.r*0.25, -b.r*0.3, b.r*0.35, b.r*0.2, -0.5, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();

    // Number
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.font = `bold ${Math.round(b.r*0.7)}px 'Orbitron', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(b.num).padStart(2,'0'), 0, 1);

    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    balls.forEach((b, i) => {
      b.x += b.vx;
      b.y += b.vy;
      b.rot += b.rotV;
      if (b.y < -b.r * 2) {
        balls[i] = makeBall();
      }
      drawBall(b);
    });
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => { resize(); init(); });
  resize();
  init();
  animate();
})();

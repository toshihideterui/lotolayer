<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loto Layer - 宝くじ予測</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a1a">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a1a;
    --bg2: #0f0f2a;
    --panel: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --gold: #ffd700;
    --gold2: #ffaa00;
    --teal: #00e5cc;
    --purple: #9b59b6;
    --pink: #ff6b9d;
    --green: #00ff88;
    --red: #ff4444;
    --text: #e8e8f0;
    --muted: rgba(255,255,255,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Starfield */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,215,0,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, rgba(0,229,204,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,107,157,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 15%, rgba(255,215,0,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 90%, rgba(0,255,136,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 50%, rgba(0,229,204,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 45% 55%, rgba(255,215,0,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 35%, rgba(255,255,255,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* Nebula bg */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 30%, rgba(155,89,182,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(0,229,204,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 40% 50% at 50% 50%, rgba(255,215,0,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 30px 0 24px;
  }

  .header-sigil {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    position: relative;
  }

  .header-sigil svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 12px rgba(255,215,0,0.6));
    animation: rotateSigil 20s linear infinite;
  }

  @keyframes rotateSigil {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, var(--gold), var(--teal), var(--gold2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }

  .header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 6px;
    letter-spacing: 0.05em;
  }

  /* Section card */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }

  .card-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: var(--teal);
    border-radius: 2px;
    display: inline-block;
  }

  /* Mode selector */
  .mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .mode-tab {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
  }

  .mode-tab .tab-name {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }

  .mode-tab .tab-desc {
    font-size: 0.7rem;
    display: block;
  }

  .mode-tab.active {
    border-color: var(--gold);
    background: rgba(255,215,0,0.08);
    color: var(--gold);
    box-shadow: 0 0 16px rgba(255,215,0,0.15);
  }

  /* Model selector */
  .model-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .model-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.8rem;
    text-align: left;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .model-btn .model-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  .model-btn.active {
    border-color: var(--teal);
    background: rgba(0,229,204,0.08);
    color: var(--teal);
  }

  .model-btn.active .model-dot {
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
  }

  /* Count selector */
  .count-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .count-label {
    color: var(--muted);
    font-size: 0.85rem;
    flex: 1;
  }

  .count-btns {
    display: flex;
    gap: 6px;
  }

  .count-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    transition: all 0.2s;
  }

  .count-btn.active {
    border-color: var(--purple);
    background: rgba(155,89,182,0.15);
    color: var(--purple);
  }

  /* API Key */
  .api-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .api-input:focus { border-color: var(--teal); }
  .api-input::placeholder { color: var(--muted); }

  /* Generate button */
  .gen-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #b8860b, var(--gold), #b8860b);
    background-size: 200% 200%;
    color: #0a0a1a;
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    animation: shimmerBg 3s ease infinite;
  }

  @keyframes shimmerBg {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .gen-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,215,0,0.3); }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Results */
  .results-area { margin-top: 0; }

  .result-set {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    animation: fadeInUp 0.4s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-set-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .set-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .set-type-badge {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 20px;
    font-family: 'Orbitron', monospace;
    letter-spacing: 0.05em;
  }

  .badge-loto6 { background: rgba(255,107,157,0.15); color: var(--pink); border: 1px solid rgba(255,107,157,0.3); }
  .badge-loto7 { background: rgba(0,229,204,0.15); color: var(--teal); border: 1px solid rgba(0,229,204,0.3); }
  .badge-mini  { background: rgba(0,255,136,0.15); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }

  /* Lottery balls */
  .balls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    justify-content: center;
  }

  .ball {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    position: relative;
    animation: ballPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    flex-shrink: 0;
  }

  @keyframes ballPop {
    from { transform: scale(0) rotate(-30deg); opacity: 0; }
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .ball::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 10px;
    width: 14px;
    height: 8px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    transform: rotate(-30deg);
  }

  /* Ball colors by range */
  .ball-white { background: radial-gradient(circle at 35% 35%, #fff, #ccc); color: #333; }
  .ball-yellow { background: radial-gradient(circle at 35% 35%, #ffe066, #cc9900); color: #222; }
  .ball-pink   { background: radial-gradient(circle at 35% 35%, #ff8ec6, #cc3377); color: #fff; }
  .ball-orange { background: radial-gradient(circle at 35% 35%, #ffa040, #cc5500); color: #fff; }
  .ball-teal   { background: radial-gradient(circle at 35% 35%, #40ffe0, #009977); color: #fff; }
  .ball-blue   { background: radial-gradient(circle at 35% 35%, #70aaff, #2244cc); color: #fff; }
  .ball-red    { background: radial-gradient(circle at 35% 35%, #ff6666, #cc0000); color: #fff; }
  .ball-bonus  {
    background: radial-gradient(circle at 35% 35%, #ffd700, #aa6600);
    color: #222;
    box-shadow: 0 0 14px rgba(255,215,0,0.5);
    border: 2px solid var(--gold);
  }

  .bonus-label {
    font-size: 0.6rem;
    color: var(--gold);
    text-align: center;
    margin-top: -6px;
    margin-bottom: 4px;
    font-family: 'Orbitron', monospace;
    letter-spacing: 0.05em;
  }

  .ball-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* AI comment */
  .ai-comment {
    background: rgba(155,89,182,0.08);
    border: 1px solid rgba(155,89,182,0.2);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.75);
    line-height: 1.6;
  }

  .ai-comment-header {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    color: var(--purple);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ai-comment-header::before {
    content: '✦';
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 4px;
  }

  .stat-cell {
    border-radius: 6px;
    padding: 4px 2px;
    text-align: center;
    cursor: default;
    transition: transform 0.15s;
  }

  .stat-cell:hover { transform: scale(1.1); }

  .stat-num {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    display: block;
  }

  .stat-count {
    font-size: 0.6rem;
    color: var(--muted);
    display: block;
  }

  /* Loading */
  .loading-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 20px;
  }

  .loading-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
    animation: dotBounce 1.2s ease infinite;
  }

  .loading-dot:nth-child(2) { animation-delay: 0.2s; background: var(--teal); }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; background: var(--pink); }

  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Error */
  .error-msg {
    background: rgba(255,68,68,0.1);
    border: 1px solid rgba(255,68,68,0.3);
    border-radius: 10px;
    padding: 12px;
    color: var(--red);
    font-size: 0.83rem;
    margin-bottom: 12px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding-top: 20px;
    color: var(--muted);
    font-size: 0.72rem;
    letter-spacing: 0.05em;
  }

  /* Frequency bar */
  .freq-bar {
    height: 3px;
    border-radius: 2px;
    margin-top: 3px;
  }

  select.api-input {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  .worker-note {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-sigil">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 3"/>
        <circle cx="50" cy="50" r="36" stroke="#00e5cc" stroke-width="0.8"/>
        <!-- Pentagram-like star -->
        <polygon points="50,10 61,38 90,38 67,56 76,84 50,66 24,84 33,56 10,38 39,38" fill="none" stroke="#ffd700" stroke-width="1.2"/>
        <!-- Inner circle -->
        <circle cx="50" cy="50" r="8" fill="#ffd700" opacity="0.8"/>
        <!-- Loto balls hint -->
        <circle cx="50" cy="50" r="4" fill="#0a0a1a"/>
      </svg>
    </div>
    <h1>LOTO LAYER</h1>
    <p>✦ 統計 × AI 予測 ✦ ロト6 / ロト7 / ミニロト ✦</p>
  </div>

  <!-- Mode Select -->
  <div class="card">
    <div class="card-title">ロトの種類</div>
    <div class="mode-tabs">
      <button class="mode-tab active" onclick="selectMode('loto6')" id="tab-loto6">
        <span class="tab-name">LOTO 6</span>
        <span class="tab-desc">1〜43 / 6個</span>
      </button>
      <button class="mode-tab" onclick="selectMode('loto7')" id="tab-loto7">
        <span class="tab-name">LOTO 7</span>
        <span class="tab-desc">1〜37 / 7個</span>
      </button>
      <button class="mode-tab" onclick="selectMode('mini')" id="tab-mini">
        <span class="tab-name">MINI</span>
        <span class="tab-desc">1〜31 / 5個</span>
      </button>
    </div>
  </div>

  <!-- Model Select -->
  <div class="card">
    <div class="card-title">AI モデル</div>
    <div class="model-grid">
      <button class="model-btn active" onclick="selectModel('llama')" id="model-llama">
        <span class="model-dot"></span>llama-3.3-70b
      </button>
      <button class="model-btn" onclick="selectModel('llama3')" id="model-llama3">
        <span class="model-dot"></span>llama-3.1-8b
      </button>
      <button class="model-btn" onclick="selectModel('gemma2')" id="model-gemma2">
        <span class="model-dot"></span>gemma2-9b-it
      </button>
      <button class="model-btn" onclick="selectModel('gemma3')" id="model-gemma3">
        <span class="model-dot"></span>gemma3-27b-it
      </button>
    </div>
  </div>

  <!-- Count & API -->
  <div class="card">
    <div class="card-title">生成セット数</div>
    <div class="count-row">
      <span class="count-label">何セット予測する？</span>
      <div class="count-btns">
        <button class="count-btn active" onclick="selectCount(1)" id="cnt-1">1</button>
        <button class="count-btn" onclick="selectCount(2)" id="cnt-2">2</button>
        <button class="count-btn" onclick="selectCount(3)" id="cnt-3">3</button>
        <button class="count-btn" onclick="selectCount(5)" id="cnt-5">5</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Groq API キー / Worker URL</div>
    <input type="password" class="api-input" id="apiKey" placeholder="gsk_... または Worker URL (https://...)" />
    <p class="worker-note">※ Cloudflare Worker Proxy URLを入力すると、APIキーを安全に隠せます</p>
  </div>

  <!-- Generate -->
  <button class="gen-btn" id="genBtn" onclick="generate()">
    ✦ 予測を生成する ✦
  </button>

  <!-- Loading -->
  <div id="loadingArea" style="display:none;">
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>

  <!-- Error -->
  <div id="errorArea" style="display:none;" class="error-msg"></div>

  <!-- Results -->
  <div id="resultsArea" class="results-area"></div>

  <!-- Stats -->
  <div class="card" id="statsCard" style="display:none;">
    <div class="card-title" id="statsTitle">出現頻度データ</div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <div class="footer">
    LOTO LAYER — Powered by Groq API × AI<br>
    ※ このアプリは娯楽目的です。当選を保証するものではありません。
  </div>
</div>

<script>
// ===== State =====
let currentMode = 'loto6';
let currentModel = 'llama';
let currentCount = 1;

const MODES = {
  loto6: { max: 43, pick: 6, bonus: 1, name: 'ロト6', badge: 'badge-loto6' },
  loto7: { max: 37, pick: 7, bonus: 2, name: 'ロト7', badge: 'badge-loto7' },
  mini:  { max: 31, pick: 5, bonus: 1, name: 'ミニロト', badge: 'badge-mini' }
};

const MODELS = {
  llama:  'llama-3.3-70b-versatile',
  llama3: 'llama-3.1-8b-instant',
  gemma2: 'gemma2-9b-it',
  gemma3: 'gemma3-27b-it'
};

// ===== Frequency data (simulated from historical patterns) =====
// Loto6: numbers 1-43, frequency weights
const FREQ_LOTO6 = [
  0,
  28,31,35,29,26,33,30,38,25,27,
  32,29,34,28,31,36,27,30,33,29,
  28,35,31,27,30,34,29,32,28,31,
  26,29,33,30,28,32,31,27,29,34,
  28,31,30
];
const FREQ_LOTO7 = [
  0,
  22,25,28,23,21,26,24,30,20,22,
  25,23,27,22,25,29,21,24,26,23,
  22,28,25,21,24,27,23,26,22,25,
  20,23,27,24,22,26,25
];
const FREQ_MINI = [
  0,
  18,21,24,19,17,22,20,26,16,18,
  21,19,23,18,21,25,17,20,22,19,
  18,24,21,17,20,23,19,22,18,21,
  16
];

function getFreq(mode) {
  if (mode === 'loto6') return FREQ_LOTO6;
  if (mode === 'loto7') return FREQ_LOTO7;
  return FREQ_MINI;
}

// ===== UI helpers =====
function selectMode(mode) {
  currentMode = mode;
  ['loto6','loto7','mini'].forEach(m => {
    document.getElementById('tab-'+m).classList.toggle('active', m === mode);
  });
  renderStats();
}

function selectModel(model) {
  currentModel = model;
  ['llama','llama3','gemma2','gemma3'].forEach(m => {
    document.getElementById('model-'+m).classList.toggle('active', m === model);
  });
}

function selectCount(n) {
  currentCount = n;
  [1,2,3,5].forEach(c => {
    document.getElementById('cnt-'+c).classList.toggle('active', c === n);
  });
}

// ===== Ball color =====
function getBallColor(num, max, isBonus) {
  if (isBonus) return 'ball-bonus';
  const ratio = num / max;
  if (ratio <= 0.14) return 'ball-white';
  if (ratio <= 0.28) return 'ball-yellow';
  if (ratio <= 0.42) return 'ball-pink';
  if (ratio <= 0.56) return 'ball-orange';
  if (ratio <= 0.70) return 'ball-teal';
  if (ratio <= 0.84) return 'ball-blue';
  return 'ball-red';
}

// ===== Stats render =====
function renderStats() {
  const mode = MODES[currentMode];
  const freq = getFreq(currentMode);
  const max = freq.slice(1).reduce((a,b) => Math.max(a,b), 0);
  const min = freq.slice(1).reduce((a,b) => Math.min(a,b), 999);
  const range = max - min || 1;

  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  document.getElementById('statsTitle').textContent = `出現頻度データ（${mode.name} 1〜${mode.max}）`;
  document.getElementById('statsCard').style.display = '';

  for (let i = 1; i <= mode.max; i++) {
    const f = freq[i];
    const ratio = (f - min) / range;
    const r = Math.round(255 * ratio);
    const g = Math.round(100 + 155 * (1 - ratio));
    const b = Math.round(200 * (1 - ratio));
    const cell = document.createElement('div');
    cell.className = 'stat-cell';
    cell.style.background = `rgba(${r},${g},${b},0.15)`;
    cell.style.border = `1px solid rgba(${r},${g},${b},0.3)`;
    cell.innerHTML = `
      <span class="stat-num" style="color:rgb(${r},${g},${b})">${String(i).padStart(2,'0')}</span>
      <span class="stat-count">${f}</span>
      <div class="freq-bar" style="background:rgba(${r},${g},${b},0.6);width:${Math.round(ratio*100)}%"></div>
    `;
    grid.appendChild(cell);
  }
}

// ===== Weighted random pick =====
function weightedPick(mode) {
  const m = MODES[mode];
  const freq = getFreq(mode);
  const total = freq.slice(1, m.max+1).reduce((a,b) => a+b, 0);

  const picked = [];
  const available = Array.from({length: m.max}, (_,i) => i+1);

  while (picked.length < m.pick) {
    const weights = available.map(n => freq[n]);
    const wTotal = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * wTotal;
    let idx = 0;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) { idx = i; break; }
    }
    picked.push(available[idx]);
    available.splice(idx, 1);
  }

  // Bonus numbers
  const bonusNums = [];
  for (let b = 0; b < m.bonus; b++) {
    const bAvail = available.filter(n => !bonusNums.includes(n));
    const bIdx = Math.floor(Math.random() * bAvail.length);
    bonusNums.push(bAvail[bIdx]);
  }

  return { main: picked.sort((a,b)=>a-b), bonus: bonusNums.sort((a,b)=>a-b) };
}

// ===== API call =====
async function callGroq(apiKey, prompt) {
  const isWorker = apiKey.startsWith('http');
  const model = MODELS[currentModel];

  if (isWorker) {
    const resp = await fetch(apiKey, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model,
        messages: [{ role: 'user', content: prompt }],
        max_tokens: 300,
        temperature: 0.8
      })
    });
    if (!resp.ok) throw new Error(`Worker error: ${resp.status}`);
    const data = await resp.json();
    return data.choices[0].message.content;
  } else {
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model,
        messages: [{ role: 'user', content: prompt }],
        max_tokens: 300,
        temperature: 0.8
      })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error: ${resp.status}`);
    }
    const data = await resp.json();
    return data.choices[0].message.content;
  }
}

// ===== Generate =====
async function generate() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    showError('APIキーまたはWorker URLを入力してください');
    return;
  }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  document.getElementById('loadingArea').style.display = '';
  document.getElementById('errorArea').style.display = 'none';
  document.getElementById('resultsArea').innerHTML = '';

  const mode = MODES[currentMode];
  const sets = [];
  for (let i = 0; i < currentCount; i++) {
    sets.push(weightedPick(currentMode));
  }

  // Render balls immediately
  const resultsArea = document.getElementById('resultsArea');
  sets.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'result-set';
    div.id = `set-${i}`;
    div.innerHTML = `
      <div class="result-set-header">
        <span class="set-label">SET ${i+1}</span>
        <span class="set-type-badge ${mode.badge}">${mode.name}</span>
      </div>
      <div class="balls-row" id="balls-${i}">
        ${s.main.map((n, bi) => `
          <div class="ball-wrapper" style="animation-delay:${bi*0.08}s">
            <div class="ball ${getBallColor(n, mode.max, false)}" style="animation-delay:${bi*0.08}s">${String(n).padStart(2,'0')}</div>
          </div>
        `).join('')}
        ${s.bonus.map((n, bi) => `
          <div class="ball-wrapper" style="animation-delay:${(s.main.length+bi)*0.08}s">
            <div class="ball ball-bonus" style="animation-delay:${(s.main.length+bi)*0.08}s">B${String(n).padStart(2,'0')}</div>
          </div>
        `).join('')}
      </div>
      <div id="comment-${i}">
        <div class="loading-dots" style="padding:10px 0">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
        </div>
      </div>
    `;
    resultsArea.appendChild(div);
  });

  document.getElementById('loadingArea').style.display = 'none';

  // AI comments for each set
  for (let i = 0; i < sets.length; i++) {
    const s = sets[i];
    const freq = getFreq(currentMode);
    const freqInfo = s.main.map(n => `${n}番(出現${freq[n]}回)`).join('、');
    const prompt = `あなたは宝くじ予測AIです。${mode.name}の予測数字について、運気・統計・直感を絡めた面白いコメントを日本語で2〜3文で書いてください。数字: ${s.main.join(', ')}（ボーナス: ${s.bonus.join(', ')}）。頻度データ: ${freqInfo}。楽しく前向きなトーンで。`;

    try {
      const comment = await callGroq(apiKey, prompt);
      document.getElementById(`comment-${i}`).innerHTML = `
        <div class="ai-comment">
          <div class="ai-comment-header">AI予測コメント — ${MODELS[currentModel]}</div>
          ${comment.trim()}
        </div>
      `;
    } catch(e) {
      document.getElementById(`comment-${i}`).innerHTML = `
        <div class="ai-comment">
          <div class="ai-comment-header">AI予測コメント</div>
          ⚠️ コメント生成エラー: ${e.message}
        </div>
      `;
    }
  }

  btn.disabled = false;
}

function showError(msg) {
  const el = document.getElementById('errorArea');
  el.textContent = msg;
  el.style.display = '';
  document.getElementById('loadingArea').style.display = 'none';
  document.getElementById('genBtn').disabled = false;
}

// ===== Init =====
renderStats();

if (savedKey) document.getElementById('apiKey').value = savedKey;
document.getElementById('apiKey').addEventListener('input', e => {
  localStorage.setItem('loto_layer_key', e.target.value);
});
